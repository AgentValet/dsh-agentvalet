name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: node scripts/no-secrets.mjs
      - run: npm run typecheck
      - run: npm test
      # tsc here is emit-only; a declaration or emit failure that `typecheck`
      # (--noEmit against the test project) cannot see would otherwise surface
      # for the first time at publish.
      - run: npm run build
